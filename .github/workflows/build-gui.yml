name: build-gui

on:
  push:
    paths:
      - 'gui/**'
      - '.github/workflows/build-gui.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Publish self-contained single-file exe
        run: dotnet publish gui/PalRelay.Gui.csproj -c Release
      - uses: actions/upload-artifact@v4
        with:
          name: PalRelay-gui
          path: gui/bin/Release/net9.0-windows/win-x64/publish/PalRelay.exe
